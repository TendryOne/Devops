name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: set up node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: install dependencies
        run: npm install

      - name: run tests
        run: npm test
